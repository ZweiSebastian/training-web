<style>
  :root { color-scheme: dark;
    --bg: #0F1115; --card: #1A1D24; --line: #2A2E38; --white: #FFFFFF; --grey: #8A90A0; --dim: #555B68;

  body { display: flex; flex-direction: column; overscroll-behavior-y: none; }

  .grow { flex: 1; min-width: 0; }
  .grey { color: var(--grey); } .dim { color: var(--dim); } .orange { color: var(--orange); } .green { color: var(--green); }
  .b { font-weight: 700; }
  .s11 { font-size: 11px; } .s12 { font-size: 12px; } .s13 { font-size: 13px; } .s14 { font-size: 14px; } .s15 { font-size: 15px; } .s17 { font-size: 17px; } .s18 { font-size: 18px; }
  .pre { white-space: pre-line; }

    background: #333845; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s;

<script>
"use strict";

// ================= Settings =================
const SB_URL = "https://hnavjodrrufagjtxekcv.supabase.co";
const SB_KEY = "sb_publishable_yaAGPz7MytzEjxG_6snJCg_s11P7Uuo";
const LS_DATA = "training-gia-data", LS_CODE = "training-gia-code", LS_STATUS = "training-gia-status", LS_BASE = "training-gia-base";

const TYPES = ["Push", "Pull", "Legs", "Core & Cardio"];
const C = { bg: "#0F1115", line: "#2A2E38", white: "#FFFFFF", grey: "#8A90A0", dim: "#555B68",
  blue: "#4F8CFF", green: "#3DDC84", orange: "#FFB454", red: "#FF6B6B", purple: "#C38CFF", teal: "#2DD4BF" };
const DAY_SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

// ================= Notation: 20×12 // 80×12 // 120×12 / 10 / 8+1 =================
const Notation = {
  fmtW(w) { return Number.isInteger(w) ? String(w) : String(+w.toFixed(2)); },
  format(blocks) {
    return blocks.filter(b => b.r.length).map(b => {
      const r = b.r.join(" / ");
      return b.w == null ? r : `${Notation.fmtW(b.w)}×${r}`;
    }).join(" // ");
  },
  head: /^([0-9]+(?:[.,][0-9]+)?)\s*[×xX*@áàaA]\s*(.*)$/,
  repRx: /^[0-9]+(\+[0-9]+)*$/,
  /** Reads the notation. Returns null if something can't be read. */
  parse(s) {
    const out = [];
    for (const part of s.split("//")) {
      const items = part.split("/").map(x => x.replace(/\s/g, "")).filter(x => x);
      if (!items.length) continue;
      const m = Notation.head.exec(items[0]);
      let b;
      if (m) { b = { w: parseFloat(m[1].replace(",", ".")), r: [] }; if (m[2]) b.r.push(m[2]); }
      else { b = { w: null, r: [items[0]] }; }
      items.slice(1).forEach(x => b.r.push(x));
      if (!b.r.length || b.r.some(x => !Notation.repRx.test(x))) return null;
      out.push(b);
    }
    return out;
  },
  /** All sets flat: [weight, reps] */
  flat(blocks) { return blocks.flatMap(b => b.r.map(r => [b.w, r])); },
};

// ================= Pounds: entered in lb, always stored and compared in kg =================
const Lb = {
  toKg: lb => Math.round(lb * 0.45359237 * 10) / 10,          // to 0.1 kg
  fromKg: kg => Math.round(kg / 0.45359237 * 2) / 2,          // to 0.5 lb (as printed on the weights)
};
const isLb = name => (S.lb || []).includes(name.trim().toLowerCase());
function setLb(name, on) {
  const k = name.trim().toLowerCase(), l = (S.lb || []).filter(x => x !== k);
  if (on) l.push(k);
  l.sort();
  if (l.length) S.lb = l; else delete S.lb;
}

// ================= Treadmill run: sections with level + minutes =================
const RunFmt = {
  lvl: v => Notation.fmtW(v),
  /** minutes as 10 or 10:30 */
  min(m) { const sec = Math.round(m * 60); return sec % 60 === 0 ? String(sec / 60) : `${Math.floor(sec / 60)}:${pad(sec % 60)}`; },
  /** "10", "10.5" or "10:30" -> minutes */
  parseMin(s) {
    const t = s.trim().replace(",", ".");
    if (!t) return null;
    if (t.includes(":")) {
      const [a, b] = t.split(":", 2);
      const mm = a ? Number(a) : 0, ss = Number(b);
      if (!Number.isInteger(mm) || !Number.isInteger(ss) || ss < 0 || ss > 59 || b === "") return null;
      return mm + ss / 60;
    }
    const v = Number(t); return isNaN(v) || v < 0 ? null : v;
  },
  parseLvl(s) { const t = s.trim().replace(",", "."); if (!t) return null; const v = Number(t); return isNaN(v) ? null : v; },
  /** "6 · 10 min → 8 · 15 min → 6 · 5 min" */
  format: r => r.abschnitte.filter(filled).map(a =>
    `${a.stufe != null ? RunFmt.lvl(a.stufe) : "?"} · ${a.min != null ? RunFmt.min(a.min) : "?"} min`).join(" → "),
};
const filled = a => a.stufe != null || a.min != null;
const runTotal = r => r.abschnitte.reduce((s, a) => s + (a.min || 0), 0);
const runEmpty = r => !r.abschnitte.some(filled) && !r.note.trim();

// ================= Data =================
let S; // { v, schedule[7], plans{type:[{n,d[]}]}, workouts[{id,date,type,note,created,e[{n,done,b[{w,r[]}]}]}],
       //   runs[{id,date,created,note,rpe?,schmerz?,abschnitte[{stufe?,min?}]}], lb?[exercise names in lower case] }

function defaults() {
  return {
    v: 1,
    // Index 0 = Monday; "" = rest day
    schedule: ["", "Legs", "Push", "Pull", "Legs", "Core & Cardio", ""],
    plans: { "Push": [], "Pull": [], "Legs": [], "Core & Cardio": [] },
    workouts: [],
    runs: [],
  };
}

function valid(o) {
  return o && Array.isArray(o.workouts) && o.plans && typeof o.plans === "object" && Array.isArray(o.schedule);
}

function normalize(o) {
  for (const w of o.workouts) {
    w.type = w.type || "Free"; w.note = w.note || ""; w.created = w.created || 0; w.e = w.e || [];
    for (const e of w.e) { e.done = !!e.done; e.b = (e.b || []).map(b => ({ w: b.w == null ? null : +b.w, r: (b.r || []).map(String) })); }
  }
  for (const t of Object.keys(o.plans)) o.plans[t] = o.plans[t].map(p => ({ n: p.n, d: p.d || [] }));
  for (const t of TYPES) if (!o.plans[t]) o.plans[t] = [];
  o.runs = (o.runs || []).map(r => {
    const x = { id: r.id, date: r.date, created: r.created || 0, note: r.note || "",
      abschnitte: (r.abschnitte || []).map(a => { const y = {}; if (a.stufe != null) y.stufe = +a.stufe; if (a.min != null) y.min = +a.min; return y; }) };
    if (r.rpe != null) x.rpe = +r.rpe;
    if (r.schmerz) x.schmerz = true;
    return x;
  });
  if (Array.isArray(o.lb) && o.lb.length) o.lb = [...new Set(o.lb.map(x => String(x).trim().toLowerCase()))].sort(); else delete o.lb;
  while (o.schedule.length < 7) o.schedule.push("");
  o.v = 1;
  return o;
}

function load() {
  try {
    const raw = localStorage.getItem(LS_DATA);
    if (raw) { const o = JSON.parse(raw); if (valid(o)) return normalize(o); }
  } catch (e) {
    try { localStorage.setItem("training-gia-broken-" + Date.now(), localStorage.getItem(LS_DATA)); } catch (_) {}
  }
  return defaults();
}

function saveNow() {
  try { localStorage.setItem(LS_DATA, JSON.stringify(S)); } catch (e) { toast("Could not save on this device"); }
}
let saveT = null;
function saveSoon() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { saveNow(); uploadSoon(); }, 400);
}

// ---------- Queries ----------
const byId = id => S.workouts.find(w => w.id === id);
function sorted() {
  return [...S.workouts].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.created - a.created);
}
const latestOn = date => sorted().find(w => w.date === date);
const runById = id => S.runs.find(r => r.id === id);
function sortedRuns() {
  return [...S.runs].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.created - a.created);
}
const runOn = date => sortedRuns().find(r => r.date === date);
/** Latest run before cur that has something logged */
const lastRun = cur => sortedRuns().find(r => r.abschnitte.some(filled) &&
  (!cur || (r.id !== cur.id && (r.date < cur.date || (r.date === cur.date && r.created < cur.created))))) || null;
function planNames(type, dow) {
  return (S.plans[type] || []).filter(p => !p.d.length || p.d.includes(dow)).map(p => p.n);
}
function older(a, cur) {
  return !cur || (a.id !== cur.id && (a.date < cur.date || (a.date === cur.date && a.created < cur.created)));
}
const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();

/** Latest entries of this exercise before workout cur (cur = null: overall). */
function history(name, cur, limit) {
  const out = [];
  for (const w of sorted()) {
    if (!older(w, cur)) continue;
    const e = w.e.find(x => same(x.n, name) && x.b.some(b => b.r.length));
    if (!e) continue;
    out.push([w, e]);
    if (out.length >= limit) break;
  }
  return out;
}
const last = (name, cur) => history(name, cur, 1)[0] || null;

const mainReps = r => parseInt(r.split("+")[0]) || 0;
const allReps = r => r.split("+").reduce((s, x) => s + (parseInt(x) || 0), 0);

/** Strongest session: heaviest weight, then most reps in the best set at that weight, then total reps at that weight.
 *  Returns [workout, blocks from the heaviest on]. */
function best(name, cur) {
  let bestW = null, bestBlocks = [], bestKey = [];
  for (const [w, e] of history(name, cur, Infinity)) {
    const blocks = e.b.filter(b => b.r.length);
    if (!blocks.length) continue;
    const ws = blocks.map(b => b.w).filter(x => x != null);
    let key, shown;
    if (ws.length) {
      const maxW = Math.max(...ws);
      const reps = blocks.filter(b => b.w === maxW).flatMap(b => b.r);
      key = [1, maxW, Math.max(...reps.map(mainReps)), reps.reduce((s, r) => s + allReps(r), 0)];
      shown = blocks.slice(blocks.findIndex(b => b.w === maxW));
    } else {
      const reps = blocks.flatMap(b => b.r);
      key = [0, 0, Math.max(...reps.map(mainReps)), reps.reduce((s, r) => s + allReps(r), 0)];
      shown = blocks;
    }
    // history is newest first -> on a tie the newer one stays
    if (!bestW || cmpKeys(key, bestKey) > 0) { bestW = w; bestBlocks = shown; bestKey = key; }
  }
  return bestW ? [bestW, bestBlocks] : null;
}
function cmpKeys(a, b) { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i] ? 1 : -1; return 0; }

function knownNames() {
  const m = new Map();
  Object.values(S.plans).flat().forEach(p => { if (!m.has(p.n.toLowerCase())) m.set(p.n.toLowerCase(), p.n); });
  S.workouts.forEach(w => w.e.forEach(e => { const k = e.n.trim().toLowerCase(); if (!m.has(k)) m.set(k, e.n.trim()); }));
  return [...m.values()].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
}

// ================= Cloud backup (Supabase, own tables for this app) =================
let code = localStorage.getItem(LS_CODE);
function newCode() {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const a = new Uint32Array(20); crypto.getRandomValues(a);
  const s = [...a].map(x => abc[x % abc.length]).join("");
  return s.match(/.{4}/g).join("-");
}
const normCode = s => (s.toUpperCase().replace(/[^A-Z0-9]/g, "").match(/.{1,4}/g) || []).join("-");
if (!code) { code = newCode(); localStorage.setItem(LS_CODE, code); }

let cloudStatus = localStorage.getItem(LS_STATUS) || "Not backed up yet";
let cloudOk = false, dirty = true, upT = null;

async function rpc(fn, body, keepalive) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: "POST", keepalive: !!keepalive,
    headers: { "Content-Type": "application/json", "apikey": SB_KEY },
    body: JSON.stringify(body),
  });
  const t = await r.text();
  if (!r.ok) throw new Error(`Server ${r.status}: ${t.slice(0, 200)}`);
  return t;
}
function uploadSoon() { dirty = true; clearTimeout(upT); upT = setTimeout(upload, 3000); }

// ---------- Merge phone <-> Supabase instead of overwriting (three-way merge, same as the Android app) ----------
// base = state that was last the same on this phone AND in the cloud (kept in localStorage)
// Per part: changed only here -> here; changed only in the cloud -> cloud; same spot changed differently on both -> cloud wins.
// Lists with "id" (or "date") are merged entry by entry, objects field by field.
const Sync = {
  canon(v) {
    if (v === undefined) return "∅";
    if (v === null) return "null";
    if (Array.isArray(v)) return "[" + v.map(Sync.canon).join(",") + "]";
    if (typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + Sync.canon(v[k])).join(",") + "}";
    return typeof v === "number" ? String(v) : JSON.stringify(v);
  },
  same: (a, b) => Sync.canon(a) === Sync.canon(b),
  isObj: v => v !== null && typeof v === "object" && !Array.isArray(v),
  /** Result of the merge; undefined = part is deleted. */
  merge(base, local, cloud) {
    const cl = Sync.canon(local), cc = Sync.canon(cloud);
    if (cl === cc) return cloud;
    const cb = Sync.canon(base);
    if (cl === cb) return cloud;     // only the cloud changed
    if (cc === cb) return local;     // only this phone changed
    if (Sync.isObj(local) && Sync.isObj(cloud)) {
      const b = Sync.isObj(base) ? base : {}, out = {};
      for (const k of new Set([...Object.keys(local), ...Object.keys(cloud)])) {
        const m = Sync.merge(b[k], local[k], cloud[k]);
        if (m !== undefined) out[k] = m;
      }
      return out;
    }
    if (Array.isArray(local) && Array.isArray(cloud)) {
      const arrs = [Array.isArray(base) ? base : null, local, cloud].filter(Boolean);
      const key = Sync.keyField(arrs);
      if (key) return Sync.mergeList(Array.isArray(base) ? base : [], local, cloud, key);
    }
    return cloud;
  },
  keyField(arrs) {
    const items = arrs.flat();
    if (!items.length || items.some(x => !Sync.isObj(x))) return null;
    for (const k of ["id", "date"]) {
      if (items.every(x => k in x) && arrs.every(a => new Set(a.map(x => String(x[k]))).size === a.length)) return k;
    }
    return null;
  },
  mergeList(base, local, cloud, key) {
    const index = a => new Map(a.map(x => [String(x[key]), x]));
    const b = index(base), l = index(local), c = index(cloud);
    // order: if this phone reordered, its order wins, otherwise the cloud's
    const primary = Sync.same([...l.keys()], [...b.keys()]) ? [...c.keys()] : [...l.keys()];
    const out = [];
    for (const k of new Set([...primary, ...c.keys(), ...l.keys()])) {
      const m = Sync.merge(b.get(k), l.get(k), c.get(k));
      if (m !== undefined) out.push(m);
    }
    return out;
  },
};
function readBase() { try { return JSON.parse(localStorage.getItem(LS_BASE) || "null"); } catch (_) { return null; } }
function writeBase(o) { try { localStorage.setItem(LS_BASE, JSON.stringify(o)); } catch (_) {} }

let syncing = false, syncAgain = false;
/** Fetch the cloud state first, merge, take over changes made elsewhere, then upload – only if something differs. */
async function upload(keepalive) {
  if (syncing) { syncAgain = true; return; }
  syncing = true; dirty = false;
  const c = code;
  let ok = false;
  try {
    const cloud = await cloudGet(c);
    if (cloud && c === code && valid(cloud)) {
      const local = JSON.parse(JSON.stringify(S));
      const merged = Sync.merge(readBase(), local, cloud);
      if (valid(merged) && !Sync.same(merged, local)) {
        S = normalize(merged); saveNow();
        if (openId && !byId(openId)) openId = null;
        if (openRunId && !runById(openRunId)) openRunId = null;
        render();
        toast("Changes from the cloud applied");
      }
    }
    const data = JSON.parse(JSON.stringify(S));
    if (!(cloud && Sync.same(data, cloud))) await rpc("put_training_gia", { p_code: c, p_data: data }, keepalive);
    writeBase(data);
    ok = true;
  } catch (e) { ok = false; }
  syncing = false;
  cloudOk = ok;
  if (ok) {
    const n = new Date();
    cloudStatus = `Backed up today ${pad(n.getHours())}:${pad(n.getMinutes())}`;
    localStorage.setItem(LS_STATUS, `Last backup ${shortDate(today())} ${pad(n.getHours())}:${pad(n.getMinutes())}`);
  } else {
    dirty = true;
    cloudStatus = "Not backed up (no internet?) – will retry automatically";
    clearTimeout(upT); upT = setTimeout(upload, 60000);
  }
  if (tab === 2) render();
  if (syncAgain) { syncAgain = false; upload(); }
}
async function cloudGet(c) {
  const a = JSON.parse((await rpc("get_training_gia", { p_code: c })) || "[]");
  return a[0] ? a[0].out_data : null;
}

// ================= Date helpers =================
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dowOf = d => (d.getDay() + 6) % 7 + 1; // 1 = Mon … 7 = Sun
const longDate = d => `${DAY_LONG[dowOf(d) - 1]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
function shortDate(s) { const d = parseD(s); return `${DAY_SHORT[dowOf(d) - 1]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; }
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

// ================= DOM helpers =================
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const txt = (s, cls, style) => h("div", { class: cls, style, text: s });
const space = n => h("div", { style: `height:${n}px` });
const button = (label, color, onclick, big) =>
  h("div", { class: "btn" + (big ? " big" : ""), style: `background:${color}`, onclick }, label);
const icon = (s, onclick) => h("div", { class: "icon", onclick }, s);
function chip(label, on, color, onclick) {
  return h("div", { class: "chip", onclick,
    style: on ? `background:${color};color:${C.bg};border-color:${color}` : `color:${color}` }, label);
}
const typeColor = t => ({ "Push": C.blue, "Pull": C.green, "Legs": C.orange, "Core & Cardio": C.purple, "Run": C.teal })[t] || C.grey;
const card = (...kids) => h("div", { class: "card" }, ...kids);
function toast(s) {
  const t = document.getElementById("toast");
  t.textContent = s; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2000);
}
function hideKb() { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }

// ---------- Sheet (dialogs) ----------
const ov = document.getElementById("ov"), sheet = document.getElementById("sheet");
ov.addEventListener("click", e => { if (e.target === ov) closeSheet(); });
function closeSheet() { ov.classList.remove("on"); sheet.innerHTML = ""; }
function openSheet({ title, message, body, items, buttons }) {
  hideKb();
  sheet.innerHTML = "";
  if (title) sheet.append(txt(title, "title"));
  if (message) sheet.append(txt(message, "msg"));
  if (body) sheet.append(body);
  if (items) items.forEach(([label, fn]) => sheet.append(h("div", { class: "item", onclick: () => { closeSheet(); fn(); } }, label)));
  const bs = buttons || (items ? [["Cancel", null]] : [["OK", null]]);
  sheet.append(h("div", { class: "btns" }, bs.map(([label, fn, primary]) =>
    button(label, primary ? C.blue : C.line, () => { if (fn && fn() === false) return; closeSheet(); }))));
  ov.classList.add("on");
}
function confirmSheet(msg, onYes) { openSheet({ title: msg, buttons: [["Cancel", null], ["Yes", onYes, true]] }); }
function nameSheet(title, initial, onOk) {
  const inp = h("input", { placeholder: "Name", autocapitalize: "words", value: initial });
  const ok = () => { const v = inp.value.trim(); if (v) onOk(v); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { closeSheet(); ok(); } });
  openSheet({ title, body: inp, buttons: [["Cancel", null], ["OK", ok, true]] });
  setTimeout(() => inp.focus(), 50);
}
/** Visible date field in a sheet – hidden pickers don't open reliably on iPhone. */
function pickDate(initial, onPick, title) {
  const inp = h("input", { type: "date", value: initial, max: today(), style: "min-height:48px" });
  openSheet({ title: title || "Choose date", body: inp,
    buttons: [["Cancel", null], ["OK", () => {
      if (!inp.value) { toast("Please choose a date"); return false; }
      onPick(inp.value);
    }, true]] });
}

// ================= Shell =================
let tab = 0;           // 0 Workout, 1 History, 2 Plan
let openId = null, openRunId = null, startType = null, histFilter = "All", renderedTab = -1;
const content = document.getElementById("content"), tabs = document.getElementById("tabs");

function render() {
  const y = renderedTab === tab ? content.scrollTop : 0;
  tabs.innerHTML = "";
  ["Workout", "History", "Plan"].forEach((t, i) =>
    tabs.append(h("div", { class: i === tab ? "on" : "", onclick: () => { hideKb(); tab = i; render(); } }, t)));
  content.innerHTML = "";
  const box = h("div", { class: "box" });
  content.append(box);
  if (tab === 0) workoutTab(box); else if (tab === 1) historyTab(box); else planTab(box);
  renderedTab = tab;
  content.scrollTop = y;
}

// ================= Tab: Workout =================
function workoutTab(box) {
  const r = openRunId && runById(openRunId);
  if (r) { runView(box, r); return; }
  openRunId = null;
  const w = openId && byId(openId);
  if (!w) { openId = null; startView(box); } else workoutView(box, w);
}

function newWorkout(date, type) {
  const w = { id: uuid(), date, type, note: "", created: Date.now(), e: [] };
  if (type !== "Free") planNames(type, dowOf(parseD(date))).forEach(n => w.e.push({ n, done: false, b: [] }));
  S.workouts.push(w);
  return w;
}

function startView(box) {
  const d = new Date(), dow = dowOf(d);
  const planned = S.schedule[dow - 1] || "Free";
  const type = startType || planned;

  box.append(h("h1", {}, longDate(d)));
  box.append(txt(planned === "Free" ? "Plan: rest day" : `Plan: ${planned}`, "grey s14", "padding:2px 0 14px"));
  box.append(h("div", { class: "chips" }, [...TYPES, "Free"].map(t => chip(t, t === type, typeColor(t), () => { startType = t; render(); }))));

  const names = type === "Free" ? [] : planNames(type, dow);
  box.append(space(12));
  if (!names.length) {
    box.append(txt(type === "Free"
      ? "Empty workout – add exercises freely (e.g. at a different gym)."
      : `No exercises planned for ${type} yet. Add them under Plan – or start and add them freely.`, "grey s14"));
  } else {
    for (const n of names) {
      const l = last(n, null);
      box.append(card(txt(n, "b"),
        txt(l ? `${shortDate(l[0].date)}:  ${Notation.format(l[1].b)}` : "No entry yet", (l ? "grey" : "dim") + " s14", "padding-top:3px")));
    }
  }
  box.append(space(12));
  box.append(button("Start workout", C.blue, () => {
    const w = newWorkout(iso(d), type);
    openId = w.id; startType = null; saveSoon(); render();
  }, true));
  const todayW = latestOn(iso(d));
  if (todayW) {
    box.append(space(8));
    box.append(button(`Reopen today's workout (${todayW.type})`, C.line, () => { openId = todayW.id; render(); }));
  }
  box.append(space(16));
  box.append(runSection(iso(d)));
  box.append(space(8));
  const y = new Date(d); y.setDate(y.getDate() - 1);
  box.append(button("Log a past workout", C.line, () => pickDate(iso(y), pd => {
    const t = S.schedule[dowOf(parseD(pd)) - 1] || "Free";
    const w = newWorkout(pd, t);
    openId = w.id; saveSoon(); render();
  }, "Which day did you train?")));
}

function workoutView(box, w) {
  const d = parseD(w.date);
  box.append(h("div", { class: "row" },
    h("div", { class: "h22 grow link", onclick: () => changeDate(w) }, longDate(d)),
    h("div", { class: "grey s14 link", style: "padding:8px 0 8px 12px", onclick: () => { hideKb(); openId = null; render(); } }, "Close")));
  const sub = h("div", { class: "row", style: "padding:8px 0 10px;gap:4px" }, chip(w.type, true, typeColor(w.type), () => changeType(w)));
  if (w.date !== today()) sub.append(txt("Logged later", "orange s13", "padding-left:4px"));
  box.append(sub);

  const done = w.e.filter(e => e.done).length;
  if (w.e.length) box.append(txt(`${done} of ${w.e.length} done`, "grey s13", "padding-bottom:6px"));
  w.e.forEach((e, i) => box.append(entryCard(w, e, i)));

  box.append(space(6));
  box.append(button("+ Add exercise", C.line, () => addExercise(w)));
  box.append(space(14));
  box.append(txt("Note", "grey s13"));
  const note = h("textarea", { placeholder: "e.g. different gym, machine taken …", rows: 2 });
  note.value = w.note;
  note.addEventListener("input", () => { w.note = note.value; saveSoon(); });
  box.append(note);
  box.append(space(18));
  box.append(runSection(w.date));
}

// ================= Treadmill run =================
/** Card "run on this day": existing run (tap = open) or a button to log one. */
function runSection(date) {
  const r = runOn(date);
  if (r && !runEmpty(r)) {
    return h("div", { class: "card link", onclick: () => { hideKb(); openRunId = r.id; tab = 0; render(); } },
      h("div", { class: "row" }, h("div", { class: "b s17 grow", style: `color:${C.teal}` }, "🏃 Run"),
        h("div", { class: "b s15" }, `${RunFmt.min(runTotal(r))} min`)),
      txt(RunFmt.format(r) || "nothing logged yet", "grey s14", "padding-top:4px"));
  }
  return button(date === today() ? "🏃 Log a run (treadmill)" : "🏃 Log a run on this day", C.line, () => { hideKb(); startRun(date); });
}

function startRun(date) {
  const ex = runOn(date);
  if (ex) { openRunId = ex.id; tab = 0; render(); return; }
  const l = lastRun(null);
  const n = (l && l.abschnitte.filter(filled).length) || 3;
  const r = { id: uuid(), date, created: Date.now(), note: "", abschnitte: Array.from({ length: n }, () => ({})) };
  S.runs.push(r);
  openRunId = r.id; tab = 0;
  saveSoon(); render();
}

function closeRun(r) {
  hideKb();
  if (runEmpty(r)) { S.runs.splice(S.runs.indexOf(r), 1); saveSoon(); }
  openRunId = null; render();
}

function runView(box, r) {
  const d = parseD(r.date);
  box.append(h("div", { class: "row" },
    h("div", { class: "h22 grow link", onclick: () => pickDate(r.date, nd => { r.date = nd; saveSoon(); render(); }, "Change date") }, longDate(d)),
    h("div", { class: "grey s14 link", style: "padding:8px 0 8px 12px", onclick: () => closeRun(r) }, "Close")));
  const sub = h("div", { class: "row", style: "padding:8px 0 10px;gap:4px" }, chip("🏃 Run · Treadmill", true, C.teal, null));
  if (r.date !== today()) sub.append(txt("Logged later", "orange s13", "padding-left:4px"));
  box.append(sub);

  const l = lastRun(r);
  if (l) box.append(txt(`Last run · ${shortDate(l.date)} · ${RunFmt.min(runTotal(l))} min:\n${RunFmt.format(l)}`, "grey s14 pre", "padding-bottom:10px"));
  const lastSegs = l ? l.abschnitte.filter(filled) : [];

  const totalT = h("div", { class: "b s17", style: "padding-top:8px" });
  const showTotal = () => { const t = runTotal(r); totalT.textContent = t > 0 ? `Total ${RunFmt.min(t)} min` : "Total –"; };

  const c = card(h("div", { class: "row grey s13", style: "padding-bottom:4px;gap:8px" },
    h("div", { style: "width:22px" }), h("div", { class: "grow" }, "Level"), h("div", { class: "grow" }, "Minutes"), h("div", { style: "width:30px" })));
  r.abschnitte.forEach((a, i) => {
    const ref = lastSegs[i];
    const lIn = h("input", { inputmode: "decimal", autocomplete: "off", style: "text-align:center",
      placeholder: ref && ref.stufe != null ? RunFmt.lvl(ref.stufe) : "e.g. 6.5" });
    if (a.stufe != null) lIn.value = RunFmt.lvl(a.stufe);
    lIn.addEventListener("input", () => { const v = RunFmt.parseLvl(lIn.value); if (v == null) delete a.stufe; else a.stufe = v; saveSoon(); });
    const mIn = h("input", { inputmode: "decimal", autocomplete: "off", style: "text-align:center",
      placeholder: ref && ref.min != null ? RunFmt.min(ref.min) : "min" });
    if (a.min != null) mIn.value = RunFmt.min(a.min);
    mIn.addEventListener("input", () => { const v = RunFmt.parseMin(mIn.value); if (v == null) delete a.min; else a.min = v; showTotal(); saveSoon(); });
    c.append(h("div", { class: "row", style: "padding:4px 0;gap:8px" },
      h("div", { class: "b s15 grey", style: "width:22px" }, `${i + 1}.`),
      h("div", { class: "grow" }, lIn), h("div", { class: "grow" }, mIn),
      h("div", { class: "icon dim", style: "width:30px;padding:4px 0;text-align:center",
        onclick: () => { hideKb(); r.abschnitte.splice(r.abschnitte.indexOf(a), 1); saveSoon(); render(); } }, "✕")));
  });
  c.append(h("div", { class: "b s15 link", style: `color:${C.blue};padding:10px 0 4px`,
    onclick: () => { hideKb(); r.abschnitte.push({}); saveSoon(); render(); } }, "+ Section"));
  showTotal();
  c.append(totalT);
  c.append(txt("Grey = values from your last run · minutes as 10, 10.5 or 10:30", "dim s11", "padding-top:6px"));
  box.append(c);

  if (lastSegs.length && !r.abschnitte.some(filled)) {
    box.append(button("Same as last time", C.line, () => {
      hideKb(); r.abschnitte = lastSegs.map(a => ({ ...a })); saveSoon(); render();
    }));
    box.append(space(10));
  }

  box.append(txt("How hard was it?", "grey s13"));
  for (let row = 0; row < 2; row++) {
    const rr = h("div", { class: "row", style: "padding-top:6px;gap:6px" });
    for (let k = 1; k <= 5; k++) {
      const n = row * 5 + k, on = r.rpe === n;
      rr.append(h("div", { class: "grow b s15 link",
        style: `text-align:center;padding:9px 0;border-radius:8px;${on ? `background:${C.teal};color:${C.bg}` : `border:1px solid ${C.line}`}`,
        onclick: () => { hideKb(); if (r.rpe === n) delete r.rpe; else r.rpe = n; saveSoon(); render(); } }, String(n)));
    }
    box.append(rr);
  }
  box.append(txt("1–3 easy, you can talk · 4–6 moderate · 7–8 hard · 9–10 all out", "dim s11", "padding-top:4px"));
  box.append(h("div", { class: "s15 link", style: `padding:12px 0;color:${r.schmerz ? C.red : C.white}`,
    onclick: () => { hideKb(); if (r.schmerz) delete r.schmerz; else r.schmerz = true; saveSoon(); render(); } },
    (r.schmerz ? "☑" : "☐") + " Pain / discomfort"));

  box.append(txt("Note", "grey s13"));
  const note = h("textarea", { placeholder: "e.g. incline, heart rate, how it went …", rows: 2 });
  note.value = r.note;
  note.addEventListener("input", () => { r.note = note.value; saveSoon(); });
  box.append(note);
  box.append(space(14));
  box.append(button("Done", C.teal, () => closeRun(r)));
  box.append(space(8));
  box.append(button("Delete run", C.line, () => confirmSheet(`Delete run from ${shortDate(r.date)}?`, () => {
    S.runs.splice(S.runs.indexOf(r), 1); openRunId = null; saveSoon(); render();
  })));
}

function entryCard(w, e, idx) {
  const c = h("div", { class: "card" });
  const lastE = last(e.n, w);
  const flatLast = lastE ? Notation.flat(lastE[1].b) : [];

  // Header: ✓  Name  ↑ ↓ ⋮
  c.append(h("div", { class: "row" },
    h("div", { class: "b link", style: `font-size:22px;padding-right:12px;color:${e.done ? C.green : C.grey}`,
      onclick: () => { hideKb(); e.done = !e.done; saveSoon(); render(); } }, e.done ? "✓" : "○"),
    h("div", { class: "grow b s17 link", style: `color:${e.done ? C.grey : C.white}`, onclick: () => historySheet(e.n, w) }, e.n),
    icon("↑", () => move(w, idx, -1)), icon("↓", () => move(w, idx, 1)), icon("⋮", () => entryMenu(w, e))));

  // Last time
  c.append(txt(lastE ? `Last time · ${shortDate(lastE[0].date)}:\n${Notation.format(lastE[1].b)}` : "Last time: no entry yet",
    (lastE ? "grey" : "dim") + " s14 pre", "padding-top:6px"));

  // Strongest session (heaviest weight, most reps) + following sets
  const bst = best(e.n, w);
  if (bst) {
    const sameAsLast = lastE && bst[0].id === lastE[0].id;
    c.append(txt(sameAsLast ? "Strongest: = last time" : `Strongest · ${shortDate(bst[0].date)}:\n${Notation.format(bst[1])}`,
      "grey s14 pre", "padding-top:4px"));
  }

  // Today
  const now = h("div", { class: "b s17", style: "padding-top:6px" });
  function showNow() {
    const s = Notation.format(e.b);
    now.textContent = s || "–";
    now.style.color = !s ? C.dim : e.done ? C.grey : C.white;
  }
  showNow();
  let pressT = null;
  now.addEventListener("touchstart", () => { pressT = setTimeout(() => editTextSheet(e), 550); }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(ev => now.addEventListener(ev, () => clearTimeout(pressT), { passive: true }));
  now.addEventListener("contextmenu", ev => { ev.preventDefault(); editTextSheet(e); });
  c.append(now);

  if (e.done) return c;

  // Input: [kg] [reps] [+ Set] [↶]
  const wIn = h("input", { placeholder: "kg", inputmode: "decimal", enterkeyhint: "next", autocomplete: "off" });
  const rIn = h("input", { placeholder: "Reps", inputmode: "tel", enterkeyhint: "done", autocomplete: "off" });
  // lb mode: weight typed in pounds, stored in kg
  let lb = isLb(e.n);
  const shown = kg => Notation.fmtW(lb ? Lb.fromKg(kg) : kg);
  const lb0 = e.b[e.b.length - 1];
  if (lb0 && lb0.w != null) wIn.value = shown(lb0.w);
  const conv = h("div", { class: "s13", style: `color:${C.teal};padding-top:4px;display:none` });

  // Older sessions as fallback if a weight didn't appear last time
  let olderFlatsCache = null;
  const olderFlats = () => olderFlatsCache || (olderFlatsCache = history(e.n, w, 10).slice(1).map(x => Notation.flat(x[1].b)));

  /** Next set from last time – matched via the weight of the latest set done,
   *  so a skipped warm-up set doesn't shift everything. */
  function nextRef() {
    const dn = Notation.flat(e.b);
    if (!dn.length) return flatLast[0] || null;
    const lw = dn[dn.length - 1][0];
    const k = dn.filter(x => x[0] === lw).length;
    const idxs = flatLast.map((x, i) => x[0] === lw ? i : -1).filter(i => i >= 0);
    if (!idxs.length) return flatLast[dn.length] || null;
    return flatLast[(k - 1 < idxs.length ? idxs[k - 1] : idxs[idxs.length - 1]) + 1] || null;
  }
  /** Sets at the same weight from last time (otherwise from the latest older session that had it). */
  function refReps(wt) {
    const at = f => f.filter(x => x[0] === wt).map(x => x[1]);
    const a = at(flatLast);
    if (a.length) return a;
    for (const f of olderFlats()) { const b = at(f); if (b.length) return b; }
    return [];
  }
  /** Reps still missing today at this weight to match last time (null = nothing to compare). */
  function remaining(wt) {
    const ref = refReps(wt); if (!ref.length) return null;
    const dn = Notation.flat(e.b).filter(x => x[0] === wt).reduce((s, x) => s + allReps(x[1]), 0);
    return ref.reduce((s, r) => s + allReps(r), 0) - dn;
  }
  /** Value for an empty field: n-th set from last time at this weight, at most what's left to match. */
  function repsFor(wt) {
    const ref = refReps(wt); if (!ref.length) return null;
    const k = Notation.flat(e.b).filter(x => x[0] === wt).length;
    const per = ref[k] != null ? ref[k] : ref[ref.length - 1];
    const rest = remaining(wt);
    if (rest == null) return per;
    return rest >= 1 && rest < allReps(per) ? String(rest) : per;
  }
  /** Weight in kg from the field (converted in lb mode), otherwise the grey suggestion. Invalid input → { err }. */
  function typedW() {
    const t = wIn.value.replace(",", ".").trim();
    if (!t) { const n = nextRef(); return { w: n ? n[0] : null }; }
    const v = Number(t);
    return isNaN(v) ? { err: true } : { w: lb ? Lb.toKg(v) : v };
  }
  function hints() {
    const n = nextRef(), u = lb ? "lb" : "kg";
    wIn.placeholder = n && n[0] != null ? `${shown(n[0])} ${u}` : u;
    const cw = typedW();
    conv.textContent = !cw.err && cw.w != null ? `= ${Notation.fmtW(cw.w)} kg` : "";
    conv.style.display = lb && conv.textContent ? "block" : "none";
    let rh = null;
    const tw = typedW();
    if (!tw.err) {
      const ref = refReps(tw.w);
      if (ref.length) {
        // First set at this weight: show last time's first set, then what's left to match
        if (!Notation.flat(e.b).some(x => x[0] === tw.w)) rh = `${ref[0]} reps`;
        else {
          const rest = remaining(tw.w);
          if (rest != null) rh = rest > 0 ? `${rest} to go` : `✓ ${rest < 0 ? "+" + (-rest) : "="}`;
        }
      }
    }
    rIn.placeholder = rh || "Reps";
  }
  hints();
  wIn.addEventListener("input", hints);

  function addSet() {
    const tw = typedW();
    if (tw.err) { toast("Invalid weight"); return; }
    let reps = rIn.value.replace(/\s/g, "");
    if (!reps) reps = repsFor(tw.w) || "";
    if (!reps) { rIn.focus(); return; }
    if (!Notation.repRx.test(reps)) { toast("Reps e.g. 12 or 8+1"); return; }
    const lb = e.b[e.b.length - 1];
    if (lb && lb.w === tw.w) lb.r.push(reps); else e.b.push({ w: tw.w, r: [reps] });
    rIn.value = "";
    showNow(); hints(); saveSoon();
  }
  wIn.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); rIn.focus(); } });
  rIn.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); addSet(); } });

  // kg ⇄ lb: remembered per exercise; a number already typed is converted along
  const unitBtn = h("div", { class: "b s15 link", style: "flex:none;padding:10px 2px;min-width:26px;text-align:center",
    onmousedown: ev => ev.preventDefault() });
  const showUnit = () => { unitBtn.textContent = lb ? "lb" : "kg"; unitBtn.style.color = lb ? C.teal : C.grey; };
  showUnit();
  unitBtn.addEventListener("click", () => {
    const cur = Number(wIn.value.replace(",", ".").trim());
    const kg = wIn.value.trim() && !isNaN(cur) ? (lb ? Lb.toKg(cur) : cur) : null;
    lb = !lb; setLb(e.n, lb);
    if (kg != null) wIn.value = shown(kg);
    showUnit(); hints(); saveSoon();
  });

  c.append(h("div", { class: "row", style: "padding-top:10px;gap:8px" },
    h("div", { class: "grow" }, wIn), unitBtn, h("div", { class: "grow" }, rIn),
    // mousedown/preventDefault keeps the keyboard open on tap
    h("div", { class: "btn", style: `background:${C.blue};flex:none`, onmousedown: ev => ev.preventDefault(), onclick: addSet }, "+ Set"),
    h("div", { class: "icon", style: "padding:4px 2px 4px 4px", onmousedown: ev => ev.preventDefault(), onclick: () => {
      const lb = e.b[e.b.length - 1]; if (!lb) return;
      lb.r.pop(); if (!lb.r.length) e.b.pop();
      showNow(); hints(); saveSoon();
    } }, "↶")));
  c.append(conv);
  c.append(txt("Tap kg/lb = switch unit for this exercise (always saved in kg) · Grey: weight from last time · first set, then the reps still missing at that weight to match last time · empty field = last time's set · long-press the result = edit as text",
    "dim s11", "padding-top:6px"));
  return c;
}

function move(w, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= w.e.length) return;
  hideKb();
  [w.e[i], w.e[j]] = [w.e[j], w.e[i]];
  saveSoon(); render();
}

function entryMenu(w, e) {
  openSheet({ title: e.n, items: [
    ["History of this exercise", () => historySheet(e.n, w)],
    ["Edit as text", () => editTextSheet(e)],
    ["Rename", () => nameSheet("Rename", e.n, v => { if (isLb(e.n)) setLb(v, true); e.n = v; saveSoon(); render(); })],
    ["Remove from this workout", () => confirmSheet(`Remove ${e.n}?`, () => { w.e.splice(w.e.indexOf(e), 1); saveSoon(); render(); })],
  ] });
}

function editTextSheet(e) {
  const inp = h("input", { placeholder: "20×12 // 80×12 // 120×12 / 10 / 8+1", autocapitalize: "off", autocorrect: "off", spellcheck: "false" });
  inp.value = Notation.format(e.b);
  openSheet({ title: e.n,
    message: "// = new weight, / = another set, × (or x) separates weight and reps. Without weight just the reps, e.g. 15 / 15 / 12.",
    body: inp,
    buttons: [["Cancel", null], ["Apply", () => {
      const b = Notation.parse(inp.value);
      if (!b) toast("Couldn't read that – nothing changed");
      else { e.b = b; saveSoon(); render(); }
    }, true]] });
}

function historySheet(name, cur) {
  const hs = history(name, null, 30);
  const body = h("div", {});
  if (!hs.length) body.append(txt("No entries yet.", "grey"));
  hs.forEach(([w, e]) => {
    body.append(h("div", { style: "padding:8px 0;border-bottom:1px solid " + C.line },
      txt(`${shortDate(w.date)} ${w.date.slice(2, 4)} · ${w.type}${cur && w.id === cur.id ? "  ← this workout" : ""}`, "grey s13"),
      txt(Notation.format(e.b), "s15")));
  });
  openSheet({ title: name, body });
}

function addExercise(w) {
  const present = new Set(w.e.map(e => e.n.trim().toLowerCase()));
  const names = knownNames().filter(n => !present.has(n.toLowerCase()));
  const dl = h("datalist", { id: "known" }, names.map(n => h("option", { value: n })));
  const inp = h("input", { placeholder: "Exercise name", autocapitalize: "words", list: "known" });
  const add = n => { n = n.trim(); if (!n) return; w.e.push({ n, done: false, b: [] }); saveSoon(); render();
    content.scrollTop = content.scrollHeight; };
  inp.addEventListener("keydown", ev => { if (ev.key === "Enter") { closeSheet(); add(inp.value); } });
  const body = h("div", {}, inp, dl);
  if (names.length) {
    body.append(txt("Known exercises", "grey s13", "padding:14px 0 4px"));
    names.forEach(n => body.append(h("div", { class: "item", onclick: () => { closeSheet(); add(n); } }, n)));
  }
  openSheet({ title: "Add exercise", body, buttons: [["Cancel", null], ["Add", () => add(inp.value), true]] });
  setTimeout(() => inp.focus(), 50);
}

function changeDate(w) {
  hideKb();
  pickDate(w.date, nd => {
    w.date = nd;
    // nothing logged yet -> exercise list matching the new weekday
    if (w.type !== "Free" && w.e.every(e => !e.b.length)) {
      w.e = planNames(w.type, dowOf(parseD(nd))).map(n => ({ n, done: false, b: [] }));
    }
    saveSoon(); render();
  }, "Change date");
}

function changeType(w) {
  const empty = w.e.every(e => !e.b.length);
  openSheet({ title: empty ? "Change day (exercise list will be replaced)" : "Change label",
    items: [...TYPES, "Free"].map(t => [t, () => {
      w.type = t;
      if (empty) w.e = t === "Free" ? [] : planNames(t, dowOf(parseD(w.date))).map(n => ({ n, done: false, b: [] }));
      saveSoon(); render();
    }]) });
}

// ================= Tab: History =================
function historyTab(box) {
  box.append(h("h1", { style: "padding-bottom:10px" }, "History"));
  box.append(h("div", { class: "chips" }, ["All", ...TYPES, "Free", "Run"].map(t =>
    chip(t, t === histFilter, t === "All" ? C.white : typeColor(t), () => { histFilter = t; render(); }))));
  box.append(space(8));

  const ws = histFilter === "Run" ? [] : sorted().filter(w => histFilter === "All" || w.type === histFilter);
  const rs = histFilter === "All" || histFilter === "Run" ? S.runs.filter(r => !runEmpty(r)).map(r => ({ run: r, date: r.date, created: r.created })) : [];
  const list = [...ws, ...rs].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.created - a.created);
  if (!list.length) box.append(txt("No workouts yet.", "grey s15"));
  let month = "";
  for (const w of list) {
    const d = parseD(w.date);
    const m = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    if (m !== month) { month = m; box.append(txt(m, "grey s13 b", "padding:14px 2px 6px")); }
    if (w.run) { box.append(runCard(w.run, d)); continue; }
    const logged = w.e.filter(e => e.b.length);
    const c = h("div", { class: "card link" },
      h("div", { class: "row" },
        h("div", { class: "b s17" }, `${DAY_SHORT[dowOf(d) - 1]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`),
        h("div", { class: "b s17 grow", style: `color:${typeColor(w.type)};padding-left:8px` }, w.type),
        txt(`${logged.length} exercises`, "grey s13")));
    if (w.note.trim()) c.append(txt(w.note, "orange s13", "padding-top:4px"));
    if (!logged.length) c.append(txt("empty", "dim s14", "padding-top:6px"));
    for (const e of logged) { c.append(txt(e.n, "grey s13", "padding-top:8px")); c.append(txt(Notation.format(e.b), "s15")); }
    c.addEventListener("click", () => { openId = w.id; openRunId = null; tab = 0; render(); });
    c.append(h("div", { class: "s12 dim", style: "text-align:right;padding-top:6px",
      onclick: ev => { ev.stopPropagation();
        confirmSheet(`Delete workout from ${shortDate(w.date)}?`, () => {
          S.workouts.splice(S.workouts.indexOf(w), 1); if (openId === w.id) openId = null; saveSoon(); render();
        }); } }, "Delete"));
    box.append(c);
  }
  if (list.length) box.append(txt("Tap = open & edit", "dim s12", "padding-top:8px;text-align:center"));
}

function runCard(r, d) {
  const c = h("div", { class: "card link" },
    h("div", { class: "row" },
      h("div", { class: "b s17" }, `${DAY_SHORT[dowOf(d) - 1]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`),
      h("div", { class: "b s17 grow", style: `color:${C.teal};padding-left:8px` }, "Run"),
      txt(`${RunFmt.min(runTotal(r))} min`, "grey s13")));
  if (r.note.trim()) c.append(txt(r.note, "orange s13", "padding-top:4px"));
  if (r.rpe != null || r.schmerz) c.append(txt([r.rpe != null ? `Effort ${r.rpe}/10` : null, r.schmerz ? "Pain / discomfort" : null].filter(Boolean).join(" · "),
    "s13", `padding-top:4px;color:${r.schmerz ? C.red : C.grey}`));
  c.append(txt("Treadmill · level · minutes", "grey s13", "padding-top:8px"));
  c.append(txt(RunFmt.format(r) || "empty", "s15"));
  c.addEventListener("click", () => { openRunId = r.id; openId = null; tab = 0; render(); });
  c.append(h("div", { class: "s12 dim", style: "text-align:right;padding-top:6px",
    onclick: ev => { ev.stopPropagation();
      confirmSheet(`Delete run from ${shortDate(r.date)}?`, () => {
        S.runs.splice(S.runs.indexOf(r), 1); if (openRunId === r.id) openRunId = null; saveSoon(); render();
      }); } }, "Delete"));
  return c;
}

// ================= Tab: Plan =================
function planTab(box) {
  box.append(h("h1", { style: "padding-bottom:10px" }, "Plan"));
  box.append(txt("Weekly plan (tap to change)", "grey s13 b", "padding-bottom:6px"));
  const week = card();
  for (let i = 0; i < 7; i++) {
    const t = S.schedule[i];
    week.append(h("div", { class: "row link", style: "padding:6px 0", onclick: () => {
      const opts = [...TYPES, ""];
      S.schedule[i] = opts[(opts.indexOf(t) + 1) % opts.length];
      saveSoon(); render();
    } }, h("div", { class: "grow" }, DAY_LONG[i]),
      h("div", { class: "b", style: `color:${t ? typeColor(t) : C.dim}` }, t || "Rest day")));
  }
  box.append(week);

  for (const t of TYPES) {
    const list = S.plans[t] || (S.plans[t] = []);
    box.append(txt(t, "b s18", `color:${typeColor(t)};padding:18px 0 6px`));
    const c = card();
    if (!list.length) c.append(txt("No exercises yet.", "dim s14", "padding:4px 0"));
    list.forEach((p, i) => {
      const label = h("div", { class: "grow link", style: "padding:6px 0", onclick: () => planExMenu(t, p) }, txt(p.n));
      if (p.d.length) label.append(txt("only " + [...p.d].sort().map(x => DAY_SHORT[x - 1]).join(", "), "orange s12"));
      c.append(h("div", { class: "row" }, label,
        icon("↑", () => { if (i > 0) { list.splice(i - 1, 0, list.splice(i, 1)[0]); saveSoon(); render(); } }),
        icon("↓", () => { if (i < list.length - 1) { list.splice(i + 1, 0, list.splice(i, 1)[0]); saveSoon(); render(); } })));
    });
    c.append(h("div", { class: "b s15 link", style: `color:${C.blue};padding:10px 0 4px`,
      onclick: () => nameSheet(`New exercise (${t})`, "", v => { list.push({ n: v, d: [] }); saveSoon(); render(); }) }, "+ Exercise"));
    box.append(c);
  }

  // Cloud backup
  box.append(txt("Cloud backup", "b s18", "padding:22px 0 6px"));
  const good = cloudOk || cloudStatus.startsWith("Last");
  box.append(card(
    txt(cloudStatus, "s14", `color:${good ? C.green : C.orange}`),
    txt("Your recovery code (tap = copy):", "grey s13", "padding:10px 0 2px"),
    h("div", { class: "b link", style: "font-size:20px;font-family:ui-monospace,Menlo,monospace",
      onclick: () => copy(code, "Code copied") }, code),
    txt("Write it down somewhere outside this phone (e.g. a password manager). With it you get everything back on a new phone or after clearing Safari data. Every change is backed up automatically, plus a daily snapshot for the last 90 days.",
      "dim s12", "padding-top:6px")));
  box.append(button("Back up now", C.line, () => { dirty = true; cloudStatus = "Backing up …"; render(); upload(); }));
  box.append(space(8));
  box.append(button("Restore with code (new phone)", C.line, restoreFromCode));

  box.append(txt("Also as a file", "b s15", "padding:22px 0 4px"));
  box.append(txt("Optional: copy the complete data as text (e.g. send it to yourself).", "grey s13", "padding-bottom:8px"));
  box.append(button("Copy backup", C.line, () => { saveNow(); copy(JSON.stringify(S), "Backup copied"); }));
  box.append(space(8));
  box.append(button("Restore backup from text", C.line, restoreFromText));
}

function planExMenu(type, p) {
  openSheet({ title: p.n, items: [
    ["Rename", () => nameSheet("Rename", p.n, v => { p.n = v; saveSoon(); render(); })],
    ["Only on certain days…", () => {
      const sel = new Set(p.d);
      const body = h("div", {}, DAY_LONG.map((dn, i) => {
        const row = h("div", { class: "item row" }, h("div", { class: "grow" }, dn), h("div", { class: "b green" }, sel.has(i + 1) ? "✓" : ""));
        row.addEventListener("click", () => {
          sel.has(i + 1) ? sel.delete(i + 1) : sel.add(i + 1);
          row.lastChild.textContent = sel.has(i + 1) ? "✓" : "";
        });
        return row;
      }));
      openSheet({ title: "Which days? (none = always)", body,
        buttons: [["Cancel", null], ["OK", () => { p.d = [...sel].sort(); saveSoon(); render(); }, true]] });
    }],
    ["Remove from plan", () => confirmSheet(`Remove ${p.n} from ${type}?`, () => {
      const l = S.plans[type]; l.splice(l.indexOf(p), 1); saveSoon(); render(); })],
  ] });
}

function copy(s, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, () => fallbackCopy(s, done));
  else fallbackCopy(s, done);
}
function fallbackCopy(s, done) {
  const ta = h("textarea", { style: "position:fixed;top:-100px;opacity:0" }); ta.value = s;
  document.body.append(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (_) { toast("Copy failed"); } ta.remove();
}

function restoreFromCode() {
  const inp = h("input", { placeholder: "XXXX-XXXX-XXXX-XXXX-XXXX", autocapitalize: "characters", autocorrect: "off", spellcheck: "false" });
  openSheet({ title: "Restore", message: "Enter the code from your old phone. The data on this phone will then be replaced.",
    body: inp, buttons: [["Cancel", null], ["Load", () => {
      const c = normCode(inp.value);
      if (c.length < 24) { toast("Code incomplete"); return false; }
      toast("Loading …");
      cloudGet(c).then(data => {
        if (!data) { toast("No backup found for this code"); return; }
        if (!valid(data)) { toast("Backup unreadable"); return; }
        confirmSheet(`Found a backup with ${data.workouts.length} workouts. Load it now and replace the data on this phone?`, () => {
          S = normalize(data); saveNow(); writeBase(data);
          code = c; localStorage.setItem(LS_CODE, c);
          openId = (latestOn(today()) || {}).id || null; openRunId = null;
          cloudOk = true; cloudStatus = "Restored – backing up here from now on";
          render(); toast("Restored");
        });
      }, () => toast("No connection – try again later"));
    }, true]] });
  setTimeout(() => inp.focus(), 50);
}

function restoreFromText() {
  const ta = h("textarea", { placeholder: "Paste backup text here", rows: 4, autocapitalize: "off", autocorrect: "off", spellcheck: "false" });
  openSheet({ title: "Restore backup", body: ta, buttons: [["Cancel", null], ["Load", () => {
    let o; try { o = JSON.parse(ta.value); } catch (_) { o = null; }
    if (!valid(o)) { toast("That's not a training backup"); return false; }
    setTimeout(() => confirmSheet(`Load backup with ${o.workouts.length} workouts? The current data will be replaced.`, () => {
      S = normalize(o); saveNow(); openId = null; openRunId = null; uploadSoon(); render(); toast("Restored");
    }), 0);
  }, true]] });
}

// ================= Start =================
S = load();
openId = (latestOn(today()) || {}).id || null;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { clearTimeout(saveT); saveNow(); clearTimeout(upT); upload(true); }
  else { clearTimeout(upT); upload(); }   // on opening: read the cloud first (take over changes made elsewhere)
});
window.addEventListener("pagehide", () => { saveNow(); });
render();
upload();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
